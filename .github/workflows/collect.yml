name: Collect OKX Futures Market Data
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *' # UTC, optional backup; external cron-job.org is primary
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch & calculate
        run: python collector.py
      - name: Publish latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshot'
            git push
          fi

      - name: Send PushPlus WeChat summary
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import subprocess
          bj = datetime.now(timezone(timedelta(hours=8)))
          if 19 <= bj.minute <= 24:
              subprocess.run(["python", "pushplus_notify.py"], check=True)
          else:
              print("Quarter-hour signal run; skip full hourly summary")
          PY

      - name: Notify important 5-minute signal changes
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python signal_notify.py

      - name: Persist alert state
        if: always()
        run: |
          git add data/signal_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update 15m signal notification state'
            git push
          fi
