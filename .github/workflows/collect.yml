name: Collect OKX Futures Market Data
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send one QQ SMTP test email (no trade signals)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '4,19,34,49 * * * *' # UTC, optional backup; external cron-job.org is primary
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    env:
      QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate notification code syntax
        run: python -m py_compile email_notify.py email_templates.py ai_report.py hourly_plans.py risk_calc.py pushplus_notify.py recommendation_archive.py
      - name: Fetch & calculate
        run: python collector.py
      - name: Publish latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/latest.json /tmp/market-latest.json
          cp data/latest.md /tmp/market-latest.md
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          new = json.loads(Path("/tmp/market-latest.json").read_text(encoding="utf-8"))
          path = Path("data/latest.json")
          old = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          if new.get("generated_utc", "") > old.get("generated_utc", ""):
              path.write_bytes(Path("/tmp/market-latest.json").read_bytes())
              Path("data/latest.md").write_bytes(Path("/tmp/market-latest.md").read_bytes())
              print("Newer snapshot staged")
          else:
              print("Remote snapshot is as recent or newer; leave it intact")
          PY
            git add data/latest.json data/latest.md
            if git diff --cached --quiet; then
              echo "No newer snapshot to commit"
              break
            fi
            git commit -m 'Update market snapshot'
            if git push origin HEAD:main; then
              echo "Snapshot published"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Failed to publish after retries"
              exit 1
            fi
            sleep 2
          done

      - name: Send PushPlus WeChat summary (legacy fallback)
        if: ${{ env.QQ_SMTP_USER == '' }}
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import subprocess
          bj = datetime.now(timezone(timedelta(hours=8)))
          if 19 <= bj.minute <= 24:
              subprocess.run(["python", "pushplus_notify.py"], check=True)
          else:
              print("Quarter-hour signal run; skip full hourly summary")
          PY

      - name: Send separate QQ email digest and trade-only alerts
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          TEST_EMAIL: ${{ inputs.test_email == true && '1' || '0' }}
        run: python email_notify.py

      - name: Notify important 5-minute signal changes (legacy fallback)
        if: ${{ env.QQ_SMTP_USER == '' }}
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python signal_notify.py

      - name: Persist alert state and immutable recommendation emails
        if: always()
        run: |
          # Save local artifacts across git fetch/reset and push retries.
          mkdir -p /tmp/monitor-state
          [ ! -f data/signal_state.json ] || cp data/signal_state.json /tmp/monitor-state/signal_state.json
          [ ! -f data/email_state.json ] || cp data/email_state.json /tmp/monitor-state/email_state.json
          if [ -d data/recommendations ]; then
            cp -a data/recommendations /tmp/monitor-state/recommendations
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            [ ! -f /tmp/monitor-state/signal_state.json ] || cp /tmp/monitor-state/signal_state.json data/signal_state.json
            [ ! -f /tmp/monitor-state/email_state.json ] || cp /tmp/monitor-state/email_state.json data/email_state.json
            if [ -d /tmp/monitor-state/recommendations ]; then
              mkdir -p data/recommendations
              cp -a /tmp/monitor-state/recommendations/. data/recommendations/
            fi
            git add data/signal_state.json data/email_state.json data/recommendations 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No changed alert state or recommendation records"
              break
            fi
            git commit -m 'Persist alert state and sent recommendations'
            if git push origin HEAD:main; then
              echo "Recommendation history persisted"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "ERROR: failed to persist recommendation history after retries"
              exit 1
            fi
            sleep 2
          done
