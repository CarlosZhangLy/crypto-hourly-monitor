name: Collect OKX Futures Market Data
on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *' # UTC; every hour at minute 19 = Beijing xx:19
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch & calculate
        run: python collector.py
      - name: Publish latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshot'
            git push
          fi
